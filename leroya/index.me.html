<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ПРИВ! — Лероя</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#d8d5ce; --hint:#3b3835;
  --paper:#e6e3dc; --paper-2:#d5d1c8; --ink:#1d1b1a; --ink-soft:#5d5955; --rule:#2a2826;
  --display:"Dela Gothic One","Arial Black","Helvetica Neue",Impact,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#000; --hint:#a9a59e; } }
:root[data-theme="dark"]{ --bg:#000; --hint:#a9a59e; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--mono);-webkit-tap-highlight-color:transparent}
.stage{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,3vh,28px);padding:20px 3vw}
.hint{margin:0;color:var(--hint);font-size:13px;letter-spacing:.02em;text-align:center}
.wrap{width:min(94vw,780px,calc((100dvh - 150px) * 1.36));container-type:inline-size;perspective:1600px}
.card{display:grid;cursor:pointer;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.7,.2,1);outline:none;border-radius:4.4cqi}
.card.is-flipped{transform:rotateY(180deg)}
.card:focus-visible{box-shadow:0 0 0 3px var(--bg),0 0 0 6px #8f7b7c}
.card.hello-wobble{animation:wobble 1.3s ease-in-out .9s 1}
@keyframes wobble{0%,100%{transform:rotateY(0)}35%{transform:rotateY(-16deg)}70%{transform:rotateY(5deg)}}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:4.4cqi;background:var(--paper);position:relative;overflow:hidden;
  box-shadow:inset 0 -0.7cqi 0 rgba(0,0,0,.08),0 2.4cqi 6cqi rgba(0,0,0,.35)}
.face::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.32;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .43  0 0 0 0 .4  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.front{display:grid;grid-template-columns:41% 1fr;gap:4.2cqi;padding:4.4cqi}
.back{transform:rotateY(180deg);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2.4cqi;padding:5cqi 7cqi;text-align:left}
.photo{position:relative;container-type:size;border-radius:3.2cqi;background:var(--paper-2);overflow:hidden;min-height:44cqi;
  background-image:radial-gradient(rgba(29,27,26,.13) 18%,transparent 20%);background-size:1.6cqi 1.6cqi}
.fig{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(94cqw,93cqh * 0.7398);aspect-ratio:1234/1668}
.fig img{position:absolute;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.fig .base{inset:0;width:100%;height:100%}
.fig .shut{visibility:hidden}
.photo.blink .shut{visibility:visible}
.photo.blink .open{visibility:hidden}
.bob{position:absolute;inset:0;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2%)}}
.p-sprout{animation:sway 2.6s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.p-handL{animation:handL 3.4s ease-in-out infinite}
.p-handR{animation:handR 3.1s ease-in-out -.9s infinite}
@keyframes handL{0%,100%{transform:rotate(0)}50%{transform:rotate(-6deg)}}
@keyframes handR{0%,100%{transform:rotate(0)}50%{transform:rotate(6deg)}}
.p-browL,.p-browR{animation:brows 5.6s ease-in-out infinite}
@keyframes brows{0%,62%,90%,100%{transform:translateY(0)}68%,82%{transform:translateY(-16%)}}
.p-nose{animation:nose 4.3s ease-in-out 1.2s infinite}
@keyframes nose{0%,38%,56%,100%{transform:scale(1)}42%{transform:scale(1.07) rotate(-3deg)}47%{transform:scale(1.05) rotate(3deg)}51%{transform:scale(1.04) rotate(-1deg)}}
.p-mouth{animation:mouth 5.1s ease-in-out 2s infinite}
@keyframes mouth{0%,58%,74%,100%{transform:scale(1)}63%,68%{transform:scale(1.18,1.3)}}
.info{display:flex;flex-direction:column;min-width:0}
.hello{font-family:var(--display);font-weight:400;font-size:12cqi;white-space:nowrap;line-height:.9;margin:0 0 .6cqi;letter-spacing:-.02em;color:var(--ink)}
.serial{font-size:max(9px,1.65cqi);color:var(--ink-soft);margin:0 0 2.6cqi;letter-spacing:.08em}
.fields{margin:0;border-top:.45cqi solid var(--rule)}
.row{display:grid;grid-template-columns:max(38px,9.5cqi) 1fr;align-items:baseline;padding:1.5cqi 0;border-bottom:.22cqi solid var(--rule)}
.row dt{font-weight:600;font-size:max(11px,2.55cqi);text-transform:uppercase}
.row dd{margin:0;font-size:max(11px,2.55cqi);text-transform:uppercase;overflow-wrap:anywhere}
.row a{color:inherit;text-decoration:none;border-bottom:.2cqi dotted var(--ink-soft);text-transform:none}
.row a:focus-visible,.find:focus-visible,.foot a:focus-visible{outline:2px solid #8f7b7c;outline-offset:3px}
.label{font-size:max(9px,1.65cqi);color:var(--ink-soft);margin:2.4cqi 0 1cqi}
.about{margin:0;background:rgba(29,27,26,.08);padding:2cqi 2.4cqi;font-size:max(10.5px,2.7cqi);line-height:1.35;text-transform:uppercase;flex:1}
.find{display:inline-flex;align-items:center;gap:2cqi;text-decoration:none;color:var(--paper);background:var(--ink);font-family:var(--display);
  font-size:8.6cqi;line-height:1;text-transform:uppercase;padding:3.2cqi 4.6cqi 3.6cqi;border-radius:2.6cqi;box-shadow:0 1cqi 0 #6f5d5e}
.find:active{transform:translateY(.7cqi);box-shadow:0 .3cqi 0 #6f5d5e}
.find span{line-height:1.02}
.find svg{width:7cqi;height:7cqi;flex:none}
.dest{margin:0;align-self:stretch;text-align:center;font-size:max(11px,2.3cqi);color:var(--ink-soft)}
.back .tiny{position:absolute;bottom:3cqi;left:0;right:0;text-align:center;margin:0;font-size:max(9.5px,1.7cqi);color:var(--ink-soft)}
.foot{display:flex;align-items:center;gap:14px;color:var(--hint);font-size:13px}
.foot b{font-family:var(--display);font-weight:400;font-size:17px;letter-spacing:-.01em}
.foot a{color:var(--hint);text-decoration:none;border-bottom:1px dotted currentColor;padding-bottom:2px}
@media (orientation:landscape) and (max-height:520px){.hint,.foot{display:none}.stage{padding:12px}.wrap{width:min(94vw,calc((100dvh - 30px) * 1.36))}}
@media (prefers-reduced-motion:reduce){.bob,.card.hello-wobble,.fig .part{animation:none}.card{transition:none}}
</style>
</head>
